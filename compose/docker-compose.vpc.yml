services:
  docurama-tenant-app:
    image: ${APP_IMAGE:?Supply a verified application digest}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/db/custom.db
      STORAGE_DIR: /app/storage
      NEXT_PUBLIC_DEMO_MODE: "false"
      DOCURAMA_DEPLOYMENT_MODE: private_cloud
      DOCURAMA_PUBLIC_REGISTRATION: "false"
      S3_BUCKET: ${S3_BUCKET:?Supply Terraform bucket output}
      S3_REGION: ${S3_REGION:?Supply AWS region}
      S3_CREDENTIALS_MODE: default
      S3_AUTO_CREATE_BUCKET: "0"
      S3_SERVER_SIDE_ENCRYPTION: aws:kms
      S3_SSE_KMS_KEY_ID: ${S3_SSE_KMS_KEY_ID:?Supply Terraform KMS key ARN}
      REKOR_WITNESS: "off"
      SMTP_URL: ${SMTP_URL:-}
    volumes:
      - ./data/db:/app/db
      - ./data/storage:/app/storage
      - ./data/certs:/app/certs:ro
    networks: [tenant_net]
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
  docurama-tenant-edge:
    image: ${EDGE_IMAGE:?Supply a verified nginx digest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.tenant.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      docurama-tenant-app:
        condition: service_healthy
    networks: [tenant_net]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
networks:
  tenant_net:
    driver: bridge
