services:
  docurama-tenant-app:
    image: ghcr.io/stalfe-cloud/docurama-enterprise:latest
    container_name: docurama-${TENANT_ID:-tenant}-app
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      - STORAGE_DIR=/app/storage
      - NEXT_PUBLIC_DEMO_MODE=false
      - DOCURAMA_DEPLOYMENT_MODE=private_cloud
      - DOCURAMA_PUBLIC_REGISTRATION=false
      - DOCURAMA_TENANT_NAME=${TENANT_NAME}
      - DOCURAMA_PART11_ENFORCED=${PART11_ENFORCED:-true}
      - DOCURAMA_TSA_URL=${TSA_URL:-http://timestamp.digicert.com}
      # Dedicated S3 object storage / CMEK
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      # Sigstore Rekor transparency witnessing
      - REKOR_API_URL=${REKOR_API_URL:-https://rekor.sigstore.dev}
      - REKOR_WITNESS=${REKOR_WITNESS:-on}
      # SMTP delivery
      - SMTP_URL=${SMTP_URL:-}
    volumes:
      - ./data/db:/app/db
      - ./data/storage:/app/storage
      - ./data/certs:/app/certs:ro
    networks:
      - tenant_net
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  docurama-tenant-edge:
    image: nginx:1.27-alpine
    container_name: docurama-${TENANT_ID:-tenant}-edge
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.tenant.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - docurama-tenant-app
    networks:
      - tenant_net

networks:
  tenant_net:
    driver: bridge
